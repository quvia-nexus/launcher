<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUVIA LAB 런처</title>
<link href="https://fonts.googleapis.com/css2?family=Gmarket+Sans:wght@300;500;700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:#0a0a12; --card:#13131f; --card-hover:#1c1c2e;
  --border:rgba(255,255,255,0.07);
  --accent1:#6c63ff; --accent2:#ff6584; --accent3:#43e6b5;
  --text:#e8e8f0; --muted:#7a7a9a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(108,99,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(108,99,255,0.04) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;z-index:0}
.orb{position:fixed;border-radius:50%;filter:blur(100px);opacity:0.15;pointer-events:none;z-index:0;animation:floatOrb 12s ease-in-out infinite}
.orb1{width:480px;height:480px;background:var(--accent1);top:-120px;left:-100px}
.orb2{width:320px;height:320px;background:var(--accent2);bottom:-80px;right:-60px;animation-delay:-5s}
.orb3{width:240px;height:240px;background:var(--accent3);top:40%;left:55%;animation-delay:-9s}
@keyframes floatOrb{0%,100%{transform:translate(0,0)}33%{transform:translate(30px,-30px)}66%{transform:translate(-20px,20px)}}

/* ── 동기화 상태 ── */
.sync-status{position:fixed;top:16px;right:16px;z-index:100;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);background:rgba(19,19,31,0.85);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:100px;padding:6px 14px;transition:all 0.3s}
.sync-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;transition:background 0.3s}
.sync-status.syncing .sync-dot{background:#ffd36e;animation:pulse 1s ease infinite}
.sync-status.connected .sync-dot{background:var(--accent3)}
.sync-status.error .sync-dot{background:var(--accent2)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.7)}}

/* ── 컨테이너 ── */
.container{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:60px 24px 100px}

/* ── 헤더 ── */
header{text-align:center;margin-bottom:48px;animation:fadeDown 0.7s ease both}
@keyframes fadeDown{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:translateY(0)}}
.logo-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(108,99,255,0.15);border:1px solid rgba(108,99,255,0.35);border-radius:100px;padding:6px 18px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--accent1);text-transform:uppercase;margin-bottom:20px}
.logo-badge .dot{width:7px;height:7px;background:var(--accent1);border-radius:50%;animation:pulse 2s ease infinite}
h1{font-family:'Gmarket Sans',sans-serif;font-size:clamp(28px,4vw,46px);font-weight:700;background:linear-gradient(135deg,#fff 30%,var(--accent1));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.2;margin-bottom:12px}
.subtitle{color:var(--muted);font-size:14px}

/* ══════════════════════════════
   홈 화면 — 폴더 그리드
══════════════════════════════ */
.home-view{animation:fadeUp 0.5s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.folder-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}

.folder-card{
  background:var(--card);border:1px solid var(--border);border-radius:22px;
  padding:32px 24px 28px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  transition:transform 0.22s,background 0.22s,border-color 0.22s,box-shadow 0.22s;
  animation:fadeUp 0.5s ease both;position:relative;overflow:hidden;
  text-align:center;
}
.folder-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--fc,var(--accent1));border-radius:22px 22px 0 0;opacity:0.9}
.folder-card:hover{background:var(--card-hover);border-color:rgba(255,255,255,0.14);transform:translateY(-6px) scale(1.02);box-shadow:0 24px 60px rgba(0,0,0,0.5)}
.folder-emoji{font-size:44px;line-height:1}
.folder-name{font-family:'Gmarket Sans',sans-serif;font-size:18px;font-weight:500;color:#fff}
.folder-count{font-size:12px;color:var(--muted);background:rgba(255,255,255,0.06);border-radius:100px;padding:3px 12px}

/* ══════════════════════════════
   폴더 내부 화면
══════════════════════════════ */
.folder-view{display:none;animation:fadeUp 0.45s ease both}
.folder-view.active{display:block}

.folder-topbar{display:flex;align-items:center;gap:14px;margin-bottom:32px}
.back-btn{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,0.07);border:1px solid var(--border);
  border-radius:100px;padding:7px 16px;font-size:13px;color:var(--muted);
  cursor:pointer;transition:all 0.2s;white-space:nowrap;
}
.back-btn:hover{background:rgba(255,255,255,0.12);color:var(--text)}
.folder-topbar-title{font-family:'Gmarket Sans',sans-serif;font-size:22px;font-weight:700;color:#fff;display:flex;align-items:center;gap:10px}
.folder-topbar-badge{font-size:12px;color:var(--muted);background:rgba(255,255,255,0.07);border-radius:100px;padding:3px 12px;font-family:'Noto Sans KR',sans-serif}

.edit-toggle{
  margin-left:auto;display:flex;align-items:center;gap:6px;
  background:rgba(108,99,255,0.15);border:1px solid rgba(108,99,255,0.3);
  border-radius:100px;padding:7px 18px;font-size:13px;color:var(--accent1);
  cursor:pointer;transition:all 0.2s;
}
.edit-toggle:hover,.edit-toggle.active{background:rgba(108,99,255,0.3);border-color:var(--accent1)}

.edit-info{font-size:12px;color:var(--muted);text-align:center;margin-bottom:12px;display:none}
.edit-info.visible{display:block}

/* ── 사이트 카드 그리드 ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-bottom:32px}

.card{
  position:relative;background:var(--card);border:1px solid var(--border);
  border-radius:18px;padding:26px 22px 22px;cursor:pointer;
  text-decoration:none;display:flex;flex-direction:column;gap:10px;
  transition:transform 0.22s,background 0.22s,border-color 0.22s,box-shadow 0.22s,opacity 0.18s;
  animation:fadeUp 0.5s ease both;overflow:hidden;user-select:none;
}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--c,var(--accent1));border-radius:18px 18px 0 0;opacity:0.85}
.card:not(.edit-active):hover{background:var(--card-hover);border-color:rgba(255,255,255,0.13);transform:translateY(-5px) scale(1.01);box-shadow:0 20px 60px rgba(0,0,0,0.45)}
.card.edit-active{cursor:grab;border-color:rgba(108,99,255,0.2)}
.card.edit-active:hover{background:var(--card-hover);border-color:rgba(108,99,255,0.45)}
.card.dragging{opacity:0.35;transform:scale(0.97);cursor:grabbing;box-shadow:none}
.card.drag-over{border-color:var(--accent1)!important;box-shadow:0 0 0 2px var(--accent1),0 16px 48px rgba(108,99,255,0.4);transform:scale(1.03)}
.drag-handle{position:absolute;top:50%;left:10px;transform:translateY(-50%);font-size:16px;color:rgba(255,255,255,0.2);opacity:0;transition:opacity 0.2s;pointer-events:none}
.card.edit-active:hover .drag-handle{opacity:1}
.card-icon{font-size:28px;line-height:1}
.card-name{font-family:'Gmarket Sans',sans-serif;font-size:16px;font-weight:500;color:#fff}
.card-url{font-size:11px;color:var(--muted);word-break:break-all;margin-top:auto;display:flex;align-items:center;gap:5px}
.card-url svg{flex-shrink:0;opacity:0.5}
.card-arrow{position:absolute;top:22px;right:18px;font-size:18px;opacity:0;color:var(--muted);transform:translateX(-6px);transition:opacity 0.2s,transform 0.2s}
.card:not(.edit-active):hover .card-arrow{opacity:1;transform:translateX(0)}
.card-btn-row{position:absolute;top:8px;right:8px;display:flex;gap:4px;z-index:6;opacity:0;transition:opacity 0.2s}
.card.edit-active:hover .card-btn-row{opacity:1}
.card-btn{border:none;border-radius:8px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;transition:background 0.2s,transform 0.15s}
.card-btn:hover{transform:scale(1.15)}
.card-btn-edit{background:rgba(108,99,255,0.22);color:#a89fff}
.card-btn-edit:hover{background:rgba(108,99,255,0.45)}
.card-btn-move{background:rgba(67,230,181,0.18);color:#43e6b5}
.card-btn-move:hover{background:rgba(67,230,181,0.38)}
.card-btn-delete{background:rgba(255,100,100,0.18);color:#ff6b6b}
.card-btn-delete:hover{background:rgba(255,100,100,0.38)}

/* ── 폴더 이동 모달 ── */
.move-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:300;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s}
.move-backdrop.open{opacity:1;pointer-events:auto}
.move-modal{background:#16162a;border:1px solid rgba(67,230,181,0.25);border-radius:22px;padding:28px;width:90%;max-width:360px;transform:scale(0.92) translateY(16px);transition:transform 0.22s}
.move-backdrop.open .move-modal{transform:scale(1) translateY(0)}
.move-modal-title{font-family:'Gmarket Sans',sans-serif;font-size:17px;font-weight:700;color:#fff;margin-bottom:6px}
.move-modal-sub{font-size:12px;color:var(--muted);margin-bottom:20px}
.move-modal-sub strong{color:var(--accent3)}
.folder-pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.folder-pick-btn{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:16px 10px;
  background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,255,255,0.08);
  border-radius:14px;cursor:pointer;
  transition:all 0.18s;
}
.folder-pick-btn:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2);transform:translateY(-2px)}
.folder-pick-btn.current{opacity:0.35;cursor:not-allowed;pointer-events:none}
.folder-pick-btn .fp-emoji{font-size:26px}
.folder-pick-btn .fp-name{font-size:13px;font-weight:500;color:#fff}
.move-cancel{width:100%;margin-top:14px;padding:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:10px;color:var(--muted);font-size:13px;cursor:pointer;transition:all 0.2s}
.move-cancel:hover{background:rgba(255,255,255,0.1)}

/* ── 사이트 추가 버튼 ── */
.add-btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:18px;
  background:rgba(108,99,255,0.07);border:1.5px dashed rgba(108,99,255,0.35);
  border-radius:18px;color:var(--accent1);font-size:14px;font-weight:500;
  cursor:pointer;transition:all 0.2s;
}
.add-btn:hover{background:rgba(108,99,255,0.14);border-color:rgba(108,99,255,0.6)}
.add-btn-icon{font-size:22px}

/* ══════════════════════════════
   모달
══════════════════════════════ */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.25s}
.modal-backdrop.open{opacity:1;pointer-events:auto}
.modal{background:#16162a;border:1px solid rgba(108,99,255,0.25);border-radius:22px;padding:32px;width:90%;max-width:460px;transform:scale(0.92) translateY(20px);transition:transform 0.25s;max-height:90vh;overflow-y:auto}
.modal-backdrop.open .modal{transform:scale(1) translateY(0)}
.modal-title{font-family:'Gmarket Sans',sans-serif;font-size:20px;font-weight:700;color:#fff;margin-bottom:24px}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px;letter-spacing:0.5px}
.form-group input{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:11px 14px;color:var(--text);font-size:14px;font-family:'Noto Sans KR',sans-serif;outline:none;transition:border-color 0.2s}
.form-group input:focus{border-color:var(--accent1)}
.form-group input::placeholder{color:rgba(255,255,255,0.2)}
.icon-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.icon-opt{width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:20px;border-radius:10px;cursor:pointer;background:rgba(255,255,255,0.05);border:1.5px solid transparent;transition:all 0.15s}
.icon-opt:hover{background:rgba(255,255,255,0.1)}
.icon-opt.selected{border-color:var(--accent1);background:rgba(108,99,255,0.2)}
.color-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.color-opt{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:all 0.15s;transform:scale(1)}
.color-opt:hover{transform:scale(1.15)}
.color-opt.selected{border-color:#fff;transform:scale(1.2)}
.modal-actions{display:flex;gap:10px;margin-top:24px}
.btn-cancel{flex:1;padding:12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:12px;color:var(--muted);font-size:14px;cursor:pointer;transition:all 0.2s}
.btn-cancel:hover{background:rgba(255,255,255,0.1)}
.btn-save{flex:2;padding:12px;background:var(--accent1);border:none;border-radius:12px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all 0.2s}
.btn-save:hover{background:#7c74ff;transform:translateY(-1px)}

/* ── 토스트 ── */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e1e35;border:1px solid rgba(108,99,255,0.3);border-radius:100px;padding:10px 22px;font-size:13px;z-index:300;opacity:0;transition:all 0.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── 빈 상태 ── */
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state .empty-icon{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:14px;line-height:1.7}

/* 작업중 폴더 느낌 */
.folder-wip{opacity:0.75}
.folder-wip .folder-name::after{content:' 🚧';font-size:14px}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<div class="sync-status syncing" id="syncStatus">
  <span class="sync-dot"></span><span id="syncText">연결 중...</span>
</div>

<div class="container">
  <header>
    <div class="logo-badge"><span class="dot"></span>QUVIA LAB</div>
    <h1>사이트 런처</h1>
    <p class="subtitle">폴더를 선택해서 사이트를 관리하세요</p>
  </header>

  <!-- ════════════════════════
       홈 — 폴더 목록
  ════════════════════════ -->
  <div class="home-view" id="homeView">
    <div class="folder-grid" id="folderGrid">
      <!-- JS로 렌더링 -->
    </div>
  </div>

  <!-- ════════════════════════
       폴더 내부 뷰
  ════════════════════════ -->
  <div class="folder-view" id="folderView">
    <div class="folder-topbar">
      <button class="back-btn" onclick="goHome()">← 홈으로</button>
      <div class="folder-topbar-title" id="folderTitle">
        <span id="folderEmoji"></span>
        <span id="folderName"></span>
        <span class="folder-topbar-badge" id="folderBadge">0개</span>
      </div>
      <button class="edit-toggle" id="editToggle" onclick="toggleEditMode()">✏️ 편집</button>
    </div>
    <div class="edit-info" id="editInfo">⠿ 드래그로 순서 변경 · ✏️ 편집 · 📂 폴더 이동 · ✕ 삭제</div>
    <div class="grid" id="grid"></div>
    <button class="add-btn" onclick="openModal()">
      <span class="add-btn-icon">＋</span> 이 폴더에 사이트 추가
    </button>
  </div>
</div>

<!-- ════════════════════════
     사이트 추가/편집 모달
════════════════════════ -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-title" id="modalTitle">🌐 사이트 추가</div>
    <div class="form-group">
      <label>사이트 이름</label>
      <input id="inputName" type="text" placeholder="예) 학원 홈페이지">
    </div>
    <div class="form-group">
      <label>URL</label>
      <input id="inputUrl" type="url" placeholder="예) https://quvia-lab.com">
    </div>
    <div class="form-group">
      <label>아이콘 선택</label>
      <div class="icon-grid" id="iconGrid"></div>
    </div>
    <div class="form-group">
      <label>색상 선택</label>
      <div class="color-row" id="colorRow"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" id="btnSave" onclick="saveSite()">저장하기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ════════════════════════
     폴더 이동 모달
════════════════════════ -->
<div class="move-backdrop" id="moveBackdrop">
  <div class="move-modal">
    <div class="move-modal-title">📂 폴더 이동</div>
    <div class="move-modal-sub">이동할 폴더를 선택하세요<br>현재: <strong id="moveCurrentFolderName"></strong></div>
    <div class="folder-pick-grid" id="folderPickGrid"></div>
    <button class="move-cancel" onclick="closeMoveModal()">취소</button>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════

/* ════════════════════════════════════════════════

    { id: Date.now()+1, name:'COS Pro 연습',               url:'https://quvia-nexus.github.io/coding-star/',    icon:'💻', color:'#5bc8f5' },
    { id: Date.now()+2, name:'AI 동화책 만들기',           url:'https://quvia-nexus.github.io/PromptStory/',    icon:'📚', color:'#ffd36e' },
    { id: Date.now()+3, name:'타자연습 기록',              url:'https://quvia-nexus.github.io/typing-records/', icon:'⌨️', color:'#ff8c42' },
    { id: Date.now()+4, name:'AI·SW 사고력 올림피아드',    url:'https://quvia-olympiad-56.vercel.app/',         icon:'🏆', color:'#ff6584' },
  ],
  teacher: [
    { id: Date.now()+5, name:'영상 생성형 AI 프롬프트 빌더', url:'https://quvia-nexus.github.io/promptbuilder/', icon:'🤖', color:'#43e6b5' },
  ],
  academy: [
    { id: Date.now()+6, name:'학원 홈페이지', url:'https://www.quvia-lab.com', icon:'🏫', color:'#6c63ff' },
  ],
  wip: [],
};

/* ════════════════════════════════════════════════
   상태
════════════════════════════════════════════════ */
// data: { student: [...], teacher: [...], academy: [...], wip: [...] }
let data = { student:[], teacher:[], academy:[], wip:[] };
let currentFolder = null;   // 현재 열린 폴더 id
let editMode      = false;
let selectedIcon  = ICONS[0];
let selectedColor = COLORS[0];
let editingId     = null;

/* ════════════════════════════════════════════════
   동기화 상태 UI
════════════════════════════════════════════════ */
function setSyncStatus(state, text) {
  const el = document.getElementById('syncStatus');
  el.className = 'sync-status ' + state;
  document.getElementById('syncText').textContent = text;
}

/* ════════════════════════════════════════════════
   Supabase 저장
════════════════════════════════════════════════ */
async function save() {
  setSyncStatus('syncing', '저장 중...');
  try {
    const { error } = await db.from('launcher_data').upsert(
      { key: DB_KEY, data, updated_at: new Date().toISOString() },
      { onConflict: 'key' }
    );
    if (error) throw error;
    setSyncStatus('connected', '클라우드 동기화됨');
  } catch (err) {
    console.error('저장 실패:', err);
    setSyncStatus('error', '저장 실패 — 로컬 백업됨');
    localStorage.setItem('quvia_launcher_v2', JSON.stringify(data));
  }
}

/* ════════════════════════════════════════════════
   Supabase 불러오기
════════════════════════════════════════════════ */
async function load() {
  setSyncStatus('syncing', '불러오는 중...');
  try {
    const { data: row, error } = await db
      .from('launcher_data').select('data').eq('key', DB_KEY).single();

    if (error && error.code !== 'PGRST116') throw error;

    if (row && row.data && typeof row.data === 'object' && !Array.isArray(row.data)) {
      // 폴더 구조 데이터 존재
      data = row.data;
      // 새 폴더 키 없으면 추가
      FOLDERS.forEach(f => { if (!data[f.id]) data[f.id] = []; });
    } else if (row && Array.isArray(row.data) && row.data.length > 0) {
      // 기존 flat 배열 → 마이그레이션: 전부 student 폴더로
      showToast('📦 기존 데이터를 학생용 폴더로 이전했어요');
      data = { ...DEFAULT_SITES_BY_FOLDER };
      data.student = [...row.data, ...data.student];
      await save();
    } else {
      // 로컬 백업 확인
      const backup = localStorage.getItem('quvia_launcher_v2');
      if (backup) {
        try { data = JSON.parse(backup); } catch(_) { data = { ...DEFAULT_SITES_BY_FOLDER }; }
      } else {
        data = { ...DEFAULT_SITES_BY_FOLDER };
        await save();
      }
    }
    setSyncStatus('connected', '클라우드 동기화됨');
  } catch (err) {
    console.error('불러오기 실패:', err);
    setSyncStatus('error', '연결 실패 — 로컬 사용 중');
    const backup = localStorage.getItem('quvia_launcher_v2');
    data = backup ? JSON.parse(backup) : { ...DEFAULT_SITES_BY_FOLDER };
  }
  renderHome();
  subscribeRealtime();
}

/* ════════════════════════════════════════════════
   실시간 구독
════════════════════════════════════════════════ */
function subscribeRealtime() {
  db.channel('launcher_v2_sync')
    .on('postgres_changes', {
      event: 'UPDATE', schema: 'public',
      table: 'launcher_data', filter: `key=eq.${DB_KEY}`
    }, payload => {
      const incoming = payload.new.data;
      if (!incoming || typeof incoming !== 'object') return;
      if (JSON.stringify(incoming) === JSON.stringify(data)) return;
      data = incoming;
      if (currentFolder) renderFolder(currentFolder);
      else renderHome();
      showToast('🔄 다른 기기에서 업데이트됨');
    })
    .subscribe(status => {
      if (status === 'SUBSCRIBED') setSyncStatus('connected', '실시간 동기화 중');
    });
}

/* ════════════════════════════════════════════════
   홈 렌더링
════════════════════════════════════════════════ */
function renderHome() {
  document.getElementById('homeView').style.display = 'block';
  document.getElementById('folderView').classList.remove('active');
  currentFolder = null;
  editMode = false;

  const grid = document.getElementById('folderGrid');
  grid.innerHTML = FOLDERS.map((f, i) => {
    const count = (data[f.id] || []).length;
    return `
      <div class="folder-card${f.wip ? ' folder-wip' : ''}"
           style="--fc:${f.color};animation-delay:${i * 0.08}s"
           onclick="openFolder('${f.id}')">
        <div class="folder-emoji">${f.emoji}</div>
        <div class="folder-name">${f.name}</div>
        <div class="folder-count">${count}개의 사이트</div>
      </div>`;
  }).join('');
}

function goHome() {
  editMode = false;
  renderHome();
}

/* ════════════════════════════════════════════════
   폴더 열기
════════════════════════════════════════════════ */
function openFolder(folderId) {
  currentFolder = folderId;
  editMode = false;
  document.getElementById('homeView').style.display = 'none';
  document.getElementById('folderView').classList.add('active');

  const f = FOLDERS.find(x => x.id === folderId);
  document.getElementById('folderEmoji').textContent = f.emoji;
  document.getElementById('folderName').textContent  = f.name;
  document.getElementById('editToggle').textContent  = '✏️ 편집';
  document.getElementById('editToggle').classList.remove('active');

  renderFolder(folderId);
}

/* ════════════════════════════════════════════════
   폴더 내부 렌더링
════════════════════════════════════════════════ */
function renderFolder(folderId) {
  const sites = data[folderId] || [];
  const f     = FOLDERS.find(x => x.id === folderId);

  document.getElementById('folderBadge').textContent = `${sites.length}개`;
  document.getElementById('editInfo').classList.toggle('visible', editMode);

  const grid = document.getElementById('grid');

  if (sites.length === 0 && !editMode) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="empty-icon">${f.emoji}</div>
        <p>아직 사이트가 없어요.<br>아래 버튼으로 첫 번째 사이트를 추가해보세요!</p>
      </div>`;
    return;
  }

  grid.innerHTML = sites.map((s, i) => {
    const shortUrl = s.url.replace(/^https?:\/\//, '').substring(0, 36);
    const btnRow = editMode ? `
      <div class="card-btn-row">
        <button class="card-btn card-btn-edit"   onclick="openEditModal(event,${s.id})" title="편집">✏️</button>
        <button class="card-btn card-btn-move"   onclick="openMoveModal(event,${s.id})" title="폴더 이동">📂</button>
        <button class="card-btn card-btn-delete" onclick="deleteSite(event,${s.id})"   title="삭제">✕</button>
      </div>
      <div class="drag-handle">⠿⠿</div>` : '';
    const href   = editMode ? 'javascript:void(0)' : s.url;
    const target = editMode ? '' : 'target="_blank" rel="noopener"';
    return `
      <a class="card${editMode ? ' edit-active' : ''}"
         href="${href}" ${target}
         data-id="${s.id}"
         style="--c:${s.color};animation-delay:${i * 0.05}s"
         ${editMode ? 'draggable="true"' : ''}>
        ${btnRow}
        <div class="card-icon">${s.icon}</div>
        <div class="card-name">${s.name}</div>
        <div class="card-url">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
            <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
          ${shortUrl}
        </div>
        ${editMode ? '' : '<span class="card-arrow">→</span>'}
      </a>`;
  }).join('');

  if (editMode) initDrag();
}

/* ════════════════════════════════════════════════
   편집 모드
════════════════════════════════════════════════ */
function toggleEditMode() {
  editMode = !editMode;
  const btn = document.getElementById('editToggle');
  btn.textContent = editMode ? '✅ 완료' : '✏️ 편집';
  btn.classList.toggle('active', editMode);
  renderFolder(currentFolder);
}

/* ════════════════════════════════════════════════
   Drag & Drop
════════════════════════════════════════════════ */
let dragSrcId = null;
function initDrag() {
  document.querySelectorAll('.card.edit-active').forEach(card => {
    card.addEventListener('dragstart', onDragStart);
    card.addEventListener('dragend',   onDragEnd);
    card.addEventListener('dragover',  onDragOver);
    card.addEventListener('dragleave', onDragLeave);
    card.addEventListener('drop',      onDrop);
  });
}
function onDragStart(e) {
  dragSrcId = parseInt(this.dataset.id);
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function onDragEnd() {
  this.classList.remove('dragging');
  document.querySelectorAll('.card').forEach(c => c.classList.remove('drag-over'));
}
function onDragOver(e) {
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  if (parseInt(this.dataset.id) !== dragSrcId) this.classList.add('drag-over');
}
function onDragLeave() { this.classList.remove('drag-over'); }
function onDrop(e) {
  e.preventDefault(); e.stopPropagation();
  this.classList.remove('drag-over');
  const targetId = parseInt(this.dataset.id);
  if (targetId === dragSrcId) return;
  const sites  = data[currentFolder];
  const srcIdx = sites.findIndex(s => s.id === dragSrcId);
  const tgtIdx = sites.findIndex(s => s.id === targetId);
  if (srcIdx === -1 || tgtIdx === -1) return;
  const [moved] = sites.splice(srcIdx, 1);
  sites.splice(tgtIdx, 0, moved);
  save(); renderFolder(currentFolder);
}

/* ════════════════════════════════════════════════
   카드 액션 (삭제)
════════════════════════════════════════════════ */
function deleteSite(e, id) {
  e.preventDefault(); e.stopPropagation();
  if (!confirm('이 사이트를 삭제할까요?')) return;
  data[currentFolder] = (data[currentFolder] || []).filter(s => s.id !== id);
  save(); renderFolder(currentFolder);
  showToast('🗑️ 삭제되었습니다');
}

/* ════════════════════════════════════════════════
   폴더 이동 모달
════════════════════════════════════════════════ */
let movingId = null;

function openMoveModal(e, id) {
  e.preventDefault(); e.stopPropagation();
  movingId = id;

  // 현재 폴더 이름 표시
  const cf = FOLDERS.find(x => x.id === currentFolder);
  document.getElementById('moveCurrentFolderName').textContent = `${cf.emoji} ${cf.name}`;

  // 폴더 선택 버튼 렌더링 (현재 폴더는 비활성)
  document.getElementById('folderPickGrid').innerHTML = FOLDERS.map(f => `
    <button class="folder-pick-btn${f.id === currentFolder ? ' current' : ''}"
            style="border-color:${f.id === currentFolder ? 'rgba(255,255,255,0.06)' : f.color+'44'}"
            onclick="moveSiteTo('${f.id}')">
      <span class="fp-emoji">${f.emoji}</span>
      <span class="fp-name">${f.name}</span>
      ${f.id === currentFolder ? '<span style="font-size:10px;color:var(--muted)">현재 폴더</span>' : ''}
    </button>`
  ).join('');

  document.getElementById('moveBackdrop').classList.add('open');
}

function closeMoveModal() {
  document.getElementById('moveBackdrop').classList.remove('open');
  movingId = null;
}

function moveSiteTo(targetFolderId) {
  if (!movingId || targetFolderId === currentFolder) return;

  // 현재 폴더에서 꺼내기
  const fromSites = data[currentFolder] || [];
  const siteIdx   = fromSites.findIndex(s => s.id === movingId);
  if (siteIdx === -1) return;

  const [site] = fromSites.splice(siteIdx, 1);
  data[currentFolder] = fromSites;

  // 대상 폴더에 넣기
  if (!data[targetFolderId]) data[targetFolderId] = [];
  data[targetFolderId].push(site);

  save();
  renderFolder(currentFolder);
  closeMoveModal();

  const tf = FOLDERS.find(x => x.id === targetFolderId);
  showToast(`📂 "${site.name}"을(를) ${tf.emoji} ${tf.name}(으)로 이동했어요`);
}

/* ════════════════════════════════════════════════
   모달
════════════════════════════════════════════════ */
function buildIconGrid() {
  document.getElementById('iconGrid').innerHTML = ICONS.map(ic =>
    `<div class="icon-opt${ic === selectedIcon ? ' selected' : ''}" onclick="selectIcon('${ic}',this)">${ic}</div>`
  ).join('');
}
function buildColorRow() {
  document.getElementById('colorRow').innerHTML = COLORS.map(c =>
    `<div class="color-opt${c === selectedColor ? ' selected' : ''}" style="background:${c}" onclick="selectColor('${c}',this)"></div>`
  ).join('');
}
function selectIcon(ic, el) {
  selectedIcon = ic;
  document.querySelectorAll('.icon-opt').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
}
function selectColor(c, el) {
  selectedColor = c;
  document.querySelectorAll('.color-opt').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
}
function openModal() {
  editingId = null;
  selectedIcon = ICONS[0]; selectedColor = COLORS[0];
  document.getElementById('modalTitle').textContent = '🌐 사이트 추가';
  document.getElementById('btnSave').textContent    = '저장하기';
  document.getElementById('inputName').value = '';
  document.getElementById('inputUrl').value  = '';
  buildIconGrid(); buildColorRow();
  document.getElementById('modalBackdrop').classList.add('open');
  setTimeout(() => document.getElementById('inputName').focus(), 200);
}
function openEditModal(e, id) {
  e.preventDefault(); e.stopPropagation();
  const s = (data[currentFolder] || []).find(x => x.id === id);
  if (!s) return;
  editingId = id; selectedIcon = s.icon; selectedColor = s.color;
  document.getElementById('modalTitle').textContent = '✏️ 사이트 편집';
  document.getElementById('btnSave').textContent    = '수정하기';
  document.getElementById('inputName').value = s.name;
  document.getElementById('inputUrl').value  = s.url;
  buildIconGrid(); buildColorRow();
  document.getElementById('modalBackdrop').classList.add('open');
  setTimeout(() => document.getElementById('inputName').focus(), 200);
}
function closeModal() {
  document.getElementById('modalBackdrop').classList.remove('open');
  editingId = null;
}
function saveSite() {
  const name = document.getElementById('inputName').value.trim();
  let   url  = document.getElementById('inputUrl').value.trim();
  if (!name) { showToast('이름을 입력해주세요!'); return; }
  if (!url)  { showToast('URL을 입력해주세요!');  return; }
  if (!url.startsWith('http')) url = 'https://' + url;

  if (!data[currentFolder]) data[currentFolder] = [];

  if (editingId !== null) {
    data[currentFolder] = data[currentFolder].map(s =>
      s.id === editingId ? { ...s, name, url, icon: selectedIcon, color: selectedColor } : s
    );
    showToast('✅ 수정되었습니다!');
  } else {
    data[currentFolder].push({ id: Date.now(), name, url, icon: selectedIcon, color: selectedColor });
    showToast('✨ 사이트가 추가되었습니다!');
  }
  save(); renderFolder(currentFolder); closeModal();
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

/* ════════════════════════════════════════════════
   키보드 & 이벤트
════════════════════════════════════════════════ */
document.getElementById('modalBackdrop').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.getElementById('moveBackdrop').addEventListener('click', function(e) {
  if (e.target === this) closeMoveModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeMoveModal(); }
  if (e.key === 'Enter' && document.getElementById('modalBackdrop').classList.contains('open')) saveSite();
});

/* 시작 */
load();
</script>
